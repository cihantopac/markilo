name: Bug report
description: Something in Markilo does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste private brand material, API keys or unreleased product names. Use synthetic examples.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or skill you ran and the JSON error (code and message), if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal synthetic SVG or brief helps a lot.
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `node dist/markilo.mjs doctor` and `claude --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
