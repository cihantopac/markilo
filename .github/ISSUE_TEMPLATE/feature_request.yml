name: Feature request
description: Propose a new capability, export target or check
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For new export targets or platform rules, link the official specification.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
