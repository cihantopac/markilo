name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundled dist matches sources
        run: npm run check:dist
      - name: Toolchain self-check
        run: node plugin/dist/markilo.mjs doctor
      - name: Smoke test (empty folder to installed assets)
        run: node scripts/smoke.mjs

  plugin:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate . --strict
          claude plugin validate plugin --strict
      - name: Install from the marketplace and smoke-test the installed copy
        run: |
          claude plugin marketplace add ./
          claude plugin install markilo@markilo
          cli=$(ls -d ~/.claude/plugins/cache/markilo/markilo/*/dist/markilo.mjs | head -n 1)
          test -n "$cli"
          node scripts/smoke.mjs "$cli"
