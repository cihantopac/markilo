<!doctype html>
<!--
  Source of assets/social-preview.png (the GitHub social preview, 1280 × 640).
  Render: serve the repository root over http, open this page at a 1280 × 640 viewport, device scale 1, and capture
  the viewport. It uses only Markilo's three colours and the README's own gallery screenshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markilo social preview</title>
<style>
:root{--paper:#f2ece1;--card:#fbf8f2;--ink:#16120f;--muted:#6b625b;--oxblood:#7e1d2a;--stage:#e6dfd2}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;position:relative}
body:before{content:"";position:absolute;right:-180px;top:-220px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(126,29,42,.07),transparent);pointer-events:none}
.left{position:absolute;left:84px;top:118px;width:520px}
.logo{height:44px;display:block}
h1{margin-top:58px;font:600 64px/1.04 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.02em}
h1 span{display:block}h1 .second{color:var(--oxblood)}
.rule{width:44px;height:3px;background:var(--oxblood);margin:34px 0 30px;border-radius:2px}
p{font-size:21px;line-height:1.5;color:var(--muted);max-width:470px}
.chips{display:flex;gap:10px;margin-top:30px}
.chips span{font-size:16px;font-weight:600;padding:9px 16px;border-radius:99px;background:var(--stage);color:var(--ink)}
.window{position:absolute;left:676px;top:92px;width:760px;height:640px;border-radius:16px;background:var(--stage);box-shadow:0 2px 6px rgba(22,18,15,.06),0 30px 80px rgba(22,18,15,.16);overflow:hidden;border:1px solid rgba(22,18,15,.08)}
.bar{height:34px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--paper);border-bottom:1px solid rgba(22,18,15,.08)}
.bar i{width:11px;height:11px;border-radius:50%;background:rgba(22,18,15,.14)}
.view{position:absolute;left:0;right:0;top:35px;bottom:0;overflow:hidden}.shot{position:absolute;width:1100px;height:auto;left:-58px;top:-182px}
</style>
</head>
<body>
<div class="left">
  <img class="logo" src="../logo-light.svg" alt="Markilo">
  <h1><span>Three identities.</span><span class="second">You choose.</span></h1>
  <div class="rule"></div>
  <p>Open-source brand identity studio for Claude Code. Real SVG, every file you need.</p>
  <div class="chips"><span>Claude Code plugin</span><span>CLI</span><span>Offline review</span></div>
</div>
<div class="window">
  <div class="bar"><i></i><i></i><i></i></div>
  <div class="view"><img class="shot" src="../screens/gallery.png" alt=""></div>
</div>
</body>
</html>
